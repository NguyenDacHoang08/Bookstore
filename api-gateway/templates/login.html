{% extends "base.html" %}

{% block title %}Đăng nhập | BookStore{% endblock %}

{% block content %}
  <section class="hero">
    <div class="row g-4">
      <div class="col-lg-6">
        <h2 class="mb-2">Đăng nhập</h2>
        <p class="muted">Nhập email và mật khẩu để đăng nhập.</p>
        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        {% endif %}
        <form method="post" class="row g-3 mt-3">
          {% csrf_token %}
          <div class="col-12">
            <label class="form-label">Email</label>
            <input name="email" type="email" class="form-control" placeholder="email@domain.com" required>
          </div>
          <div class="col-12">
            <label class="form-label">Mật khẩu</label>
            <input name="password" type="password" class="form-control" placeholder="Nhập mật khẩu" required>
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="remember" id="remember">
              <label class="form-check-label" for="remember">Nhớ đăng nhập</label>
            </div>
          </div>
          <div class="col-12 d-flex gap-2">
            <button class="btn btn-brand" type="submit">Đăng nhập</button>
            <a class="btn btn-outline-secondary" href="{% url 'register' %}">Tạo tài khoản</a>
          </div>
          <div class="col-12">
            <a href="#">Quên mật khẩu?</a>
          </div>
        </form>
      </div>
      <div class="col-lg-6">
        <div class="card-surface p-4 h-100">
        </div>
      </div>
    </div>
  </section>
{% endblock %}
